<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sylva — Admin Leaderboard</title>
<style>
  :root {
    --bg: #f7f7f1; --surface: #fff; --surface-soft: #f0f1e9;
    --border: #e2e4d8; --ink: #1d2a1f; --ink-soft: #55604f; --ink-faint: #8c9484;
    --brand: #2f6b4f; --brand-dark: #204a37; --brand-soft: #e5efe6;
    --amber: #c07a3e; --danger: #b8473d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand-dark); }
  h1, h2 { font-family: "Source Serif 4", ui-serif, Georgia, serif; font-weight: 600; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  header.bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; color: var(--brand-dark); font-family: "Source Serif 4", serif; font-weight: 600; font-size: 18px; }
  .logo svg { width: 22px; height: 22px; }
  .muted { color: var(--ink-faint); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 0 2px 8px rgba(29,42,31,.05); }

  /* login */
  .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 420px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--brand); }
  input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--brand); border: none; border-radius: 12px; cursor: pointer;
  }
  button.primary:hover { background: var(--brand-dark); }
  button.primary:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 20px; margin-top: 14px; font-size: 14px; text-align: center; }
  .msg.error { color: var(--danger); }
  .msg.info { color: var(--ink-faint); }
  .note { margin-top: 16px; font-size: 13px; color: var(--ink-faint); line-height: 1.5; }

  /* dashboard */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 18px 0 26px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .stat .n { font-size: 26px; font-weight: 700; color: var(--brand-dark); }
  .stat .l { margin-top: 4px; font-size: 13px; color: var(--ink-soft); }
  section { margin-bottom: 30px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 12px; font-size: 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .chip.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); font-weight: 600; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; white-space: nowrap; }
  thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); border-bottom: 1px solid var(--border); }
  tbody tr:nth-child(even) { background: var(--surface-soft); }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ink-soft); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .gap-pos { color: var(--amber); }   /* client claimed more than server verified */
  .btn-ghost { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--ink-soft); }
  .btn-ghost:hover { border-color: var(--ink-faint); }
  .empty { padding: 20px; color: var(--ink-faint); }

  /* ranked leaderboard (dashboard section) */
  td.rank { font-weight: 700; color: var(--brand-dark); width: 44px; }
  .medal { font-size: 16px; }

  /* big-screen present mode */
  .present {
    position: fixed; inset: 0; z-index: 50; overflow: auto;
    background: radial-gradient(circle at 50% -10%, #eaf1ea, var(--bg) 60%);
    padding: 3vh 4vw;
  }
  .present-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2vh; }
  .present-title { display: flex; align-items: baseline; gap: 14px; }
  .present-title h1 { margin: 0; font-size: clamp(28px, 4vw, 56px); color: var(--brand-dark); }
  .present-title .sub { font-size: clamp(13px, 1.3vw, 20px); color: var(--ink-faint); }
  .present-controls { display: flex; gap: 8px; align-items: center; }
  .present-select { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; font-family: inherit; color: var(--ink); }
  .present-rows { display: flex; flex-direction: column; gap: clamp(6px, 1vh, 14px); }
  .prow {
    display: grid; grid-template-columns: clamp(56px,6vw,110px) 1fr auto auto;
    align-items: center; gap: clamp(10px, 2vw, 32px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: clamp(10px, 1.6vh, 22px) clamp(16px, 2.4vw, 34px);
    box-shadow: 0 2px 10px rgba(29,42,31,.05);
  }
  .prow .p-rank { font-size: clamp(26px, 3.4vw, 52px); font-weight: 800; color: var(--ink-faint); text-align: center; font-variant-numeric: tabular-nums; }
  .prow .p-name { font-size: clamp(20px, 2.4vw, 38px); font-weight: 600; color: var(--ink); }
  .prow .p-entry { font-family: ui-monospace, Menlo, monospace; font-size: clamp(12px, 1.2vw, 18px); color: var(--ink-faint); margin-top: 2px; }
  .prow .p-algo { font-size: clamp(13px, 1.2vw, 19px); color: var(--ink-soft); text-align: right; white-space: nowrap; }
  .prow .p-score { text-align: right; }
  .prow .p-f1 { font-size: clamp(24px, 3vw, 46px); font-weight: 800; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
  .prow .p-acc { font-size: clamp(12px, 1.1vw, 17px); color: var(--ink-faint); }
  .prow.gold   { border-color: #d4b24c; background: linear-gradient(90deg, #fbf3d9, var(--surface) 55%); }
  .prow.silver { border-color: #b8bfc4; background: linear-gradient(90deg, #eef1f3, var(--surface) 55%); }
  .prow.bronze { border-color: #cd9b6a; background: linear-gradient(90deg, #f6e7d6, var(--surface) 55%); }
  .prow.gold .p-rank, .prow.silver .p-rank, .prow.bronze .p-rank { color: var(--ink); }
  .present-foot { margin-top: 2vh; text-align: center; color: var(--ink-faint); font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const LOGO = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 13C12 13 5 12.5 5 6.5C5 6.5 12 5 12 13Z" fill="currentColor" opacity="0.85"/><path d="M12 13C12 13 19 12.5 19 6.5C19 6.5 12 5 12 13Z" fill="currentColor"/></svg>';

const app = document.getElementById("app");
let activeAlgo = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtF1(v) { return v == null ? "—" : Number(v).toFixed(3); }
function fmtPct(v) { return v == null ? "—" : (Number(v) * 100).toFixed(1) + "%"; }
function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function api(path, opts) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  let body = null;
  try { body = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, body };
}

// --- login ------------------------------------------------------------------

function renderLogin(message, configured) {
  app.innerHTML = `
    <header class="bar"><div class="logo">${LOGO} Sylva Admin</div></header>
    <div class="login-wrap"><div class="card login-card">
      <h1 style="margin:0 0 4px;font-size:26px;">Admin sign in</h1>
      <p class="muted" style="margin:0;font-size:15px;">Leaderboard dashboard — restricted access.</p>
      <form id="loginForm">
        <label for="kerberos">Kerberos ID</label>
        <input id="kerberos" class="mono" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="cs1210456" />
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <div class="msg ${message ? "error" : ""}" id="loginMsg">${esc(message || "")}</div>
        <button class="primary" type="submit" id="loginBtn">Sign in</button>
      </form>
      <p class="note">${configured === false
        ? "⚠ Admin access is not configured on this server. Run <code>set_admin_password.py</code> and set the ADMIN_* environment variables, then restart."
        : "This is a separate admin password, not your institute Kerberos password."}</p>
    </div></div>`;

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMsg");
    const kerberos = document.getElementById("kerberos").value.trim();
    const password = document.getElementById("password").value;
    if (!kerberos || !password) { msg.className = "msg error"; msg.textContent = "Enter both fields."; return; }
    btn.disabled = true; msg.className = "msg info"; msg.textContent = "Signing in…";
    const { ok, body } = await api("/admin/api/login", { method: "POST", body: JSON.stringify({ kerberos, password }) });
    if (ok) { boot(); } else { btn.disabled = false; msg.className = "msg error"; msg.textContent = (body && body.detail) || "Sign in failed."; }
  });
}

// --- dashboard --------------------------------------------------------------

function statCards(o) {
  const cards = [
    ["Students", o.students],
    ["Runs", o.runs],
    ["Algorithms used", o.algorithms],
    ["Best macro F1", fmtF1(o.best_macro_f1)],
    ["Last run", fmtTime(o.last_run_at)],
  ];
  return `<div class="stat-row">${cards.map(([l, n]) => `<div class="stat"><div class="n">${esc(n ?? "—")}</div><div class="l">${l}</div></div>`).join("")}</div>`;
}

function perAlgoTable(rows) {
  if (!rows.length) return `<div class="empty">No runs yet.</div>`;
  return `<div class="table-scroll"><table>
    <thead><tr><th>Algorithm</th><th class="num">Runs</th><th class="num">Students</th><th class="num">Best F1</th><th class="num">Avg F1</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.algorithm)}</td>
      <td class="num">${r.runs}</td>
      <td class="num">${r.students}</td>
      <td class="num">${fmtF1(r.best_macro_f1)}</td>
      <td class="num">${fmtF1(r.avg_macro_f1)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function studentsTable(rows) {
  if (!rows.length) return `<div class="empty">No students registered yet.</div>`;
  return `<div class="table-scroll"><table>
    <thead><tr><th>Name</th><th>Entry no.</th><th class="num">Runs</th><th class="num">Algos</th><th class="num">Best F1</th><th>Last run</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.name)}</td>
      <td class="mono">${esc(r.entry_number)}</td>
      <td class="num">${r.total_runs}</td>
      <td class="num">${r.algorithms_tried}</td>
      <td class="num">${fmtF1(r.best_macro_f1)}</td>
      <td class="muted">${fmtTime(r.last_run_at)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function runsTable(rows) {
  if (!rows.length) return `<div class="empty">No runs for this filter.</div>`;
  return `<div class="table-scroll"><table>
    <thead><tr>
      <th>When</th><th>Name</th><th>Entry no.</th><th>Algorithm</th><th>Config</th>
      <th class="num">Seed</th><th class="num">Server F1</th><th class="num">Server acc</th><th class="num">Client acc</th><th class="num">Gap</th>
    </tr></thead>
    <tbody>${rows.map(r => {
      const gap = (r.client_accuracy != null && r.accuracy != null) ? r.client_accuracy - r.accuracy : null;
      const gapCls = gap != null && gap > 0.02 ? "gap-pos" : "";
      return `<tr>
        <td class="muted">${fmtTime(r.timestamp)}</td>
        <td>${esc(r.name)}</td>
        <td class="mono">${esc(r.entry_number)}</td>
        <td>${esc(r.algorithm)}</td>
        <td class="muted">${esc(r.summary)}</td>
        <td class="num mono">${r.seed}</td>
        <td class="num">${fmtF1(r.macro_f1)}</td>
        <td class="num">${fmtPct(r.accuracy)}</td>
        <td class="num muted">${fmtPct(r.client_accuracy)}</td>
        <td class="num ${gapCls}">${gap == null ? "—" : (gap >= 0 ? "+" : "") + (gap * 100).toFixed(1)}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

async function loadRuns() {
  const q = activeAlgo ? `?algorithm=${encodeURIComponent(activeAlgo)}` : "";
  const { ok, body } = await api(`/admin/api/runs${q}`);
  const host = document.getElementById("runsTable");
  if (host) host.innerHTML = ok ? runsTable(body) : `<div class="empty">Failed to load runs.</div>`;
}

const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };

// Ranked board = each student's best run, already sorted by the server
// (macro F1 desc, then accuracy, then earliest). This just renders that order.
function rankedBoardTable(rows) {
  if (!rows.length) return `<div class="empty">No ranked runs yet.</div>`;
  return `<div class="table-scroll"><table>
    <thead><tr><th>#</th><th>Name</th><th>Entry no.</th><th>Algorithm</th><th>Config</th><th class="num">Macro F1</th><th class="num">Accuracy</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="rank">${r.position <= 3 ? `<span class="medal">${MEDALS[r.position]}</span>` : r.position}</td>
      <td>${esc(r.name)}</td>
      <td class="mono">${esc(r.entry_number)}</td>
      <td>${esc(r.algorithm)}</td>
      <td class="muted">${esc(r.summary)}</td>
      <td class="num">${fmtF1(r.macro_f1)}</td>
      <td class="num">${fmtPct(r.accuracy)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

// --- big-screen present mode ------------------------------------------------

let presentAlgo = null;
let presentTimer = null;

async function fetchBoard(algorithm) {
  const q = new URLSearchParams({ limit: "100" });
  if (algorithm) q.set("algorithm", algorithm);
  const { ok, body } = await api(`/api/leaderboard?${q.toString()}`);
  return ok ? body : [];
}

function presentRowsHtml(rows) {
  if (!rows.length) return `<div class="empty" style="font-size:20px;text-align:center;">No runs on the board yet.</div>`;
  return rows.map(r => {
    const cls = r.position === 1 ? "gold" : r.position === 2 ? "silver" : r.position === 3 ? "bronze" : "";
    const rankCell = r.position <= 3 ? `<span class="medal" style="font-size:1em">${MEDALS[r.position]}</span>` : `#${r.position}`;
    return `<div class="prow ${cls}">
      <div class="p-rank">${rankCell}</div>
      <div><div class="p-name">${esc(r.name)}</div><div class="p-entry">${esc(r.entry_number)}</div></div>
      <div class="p-algo">${esc(r.algorithm)}<br><span style="opacity:.7">${esc(r.summary)}</span></div>
      <div class="p-score"><div class="p-f1">${fmtF1(r.macro_f1)}</div><div class="p-acc">${fmtPct(r.accuracy)} acc</div></div>
    </div>`;
  }).join("");
}

async function refreshPresent() {
  const host = document.getElementById("presentRows");
  if (!host) return;
  host.innerHTML = presentRowsHtml(await fetchBoard(presentAlgo));
  const stamp = document.getElementById("presentStamp");
  if (stamp) stamp.textContent = "updated " + new Date().toLocaleTimeString();
}

async function openPresent(algos) {
  const rows = await fetchBoard(presentAlgo);
  const overlay = document.createElement("div");
  overlay.className = "present";
  overlay.id = "presentOverlay";
  overlay.innerHTML = `
    <div class="present-head">
      <div class="present-title">
        <h1>Leaderboard</h1>
        <span class="sub">ranked by macro F1 · server-verified</span>
      </div>
      <div class="present-controls">
        <select class="present-select" id="presentFilter">
          <option value="">All algorithms</option>
          ${algos.map(a => `<option value="${esc(a)}"${presentAlgo === a ? " selected" : ""}>${esc(a)}</option>`).join("")}
        </select>
        <button class="btn-ghost" id="presentFs">⛶ Fullscreen</button>
        <button class="btn-ghost" id="presentClose">✕ Exit</button>
      </div>
    </div>
    <div class="present-rows" id="presentRows">${presentRowsHtml(rows)}</div>
    <div class="present-foot">Auto-refreshing every 15s · <span id="presentStamp">updated ${new Date().toLocaleTimeString()}</span></div>`;
  document.body.appendChild(overlay);

  presentTimer = setInterval(refreshPresent, 15000);
  document.getElementById("presentClose").addEventListener("click", closePresent);
  document.getElementById("presentFs").addEventListener("click", () => {
    if (!document.fullscreenElement) overlay.requestFullscreen?.(); else document.exitFullscreen?.();
  });
  document.getElementById("presentFilter").addEventListener("change", (e) => {
    presentAlgo = e.target.value || null;
    refreshPresent();
  });
  document.addEventListener("keydown", presentEsc);
}

function presentEsc(e) { if (e.key === "Escape" && !document.fullscreenElement) closePresent(); }

function closePresent() {
  if (presentTimer) { clearInterval(presentTimer); presentTimer = null; }
  document.removeEventListener("keydown", presentEsc);
  document.getElementById("presentOverlay")?.remove();
}

async function renderDashboard() {
  const [overview, students, runs, board] = await Promise.all([
    api("/admin/api/overview"), api("/admin/api/students"), api("/admin/api/runs"), fetchBoard(null),
  ]);

  if (overview.status === 401) { renderLogin("Your session expired — sign in again."); return; }

  const o = overview.body || {};
  const algos = (o.per_algorithm || []).map(a => a.algorithm);

  app.innerHTML = `
    <header class="bar">
      <div class="logo">${LOGO} Sylva Admin</div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn-ghost" id="refreshBtn">↻ Refresh</button>
        <button class="btn-ghost" id="logoutBtn">Sign out</button>
      </div>
    </header>
    <div class="wrap">
      <h1 style="margin:6px 0 0;font-size:28px;">Leaderboard dashboard</h1>
      <p class="muted" style="margin:4px 0 0;">The full picture behind the public board — every run, every student, and the client-vs-server score gap.</p>
      ${statCards(o)}

      <section>
        <div class="section-head">
          <h2 style="margin:0;font-size:19px;">Leaderboard — ranked</h2>
          <button class="btn-ghost" id="presentBtn">⛶ Present on big screen</button>
        </div>
        <div class="card">${rankedBoardTable(board)}</div>
        <p class="note">Each student's best run, ranked by macro F1 (then accuracy, then earliest submission). "Present on big screen" opens a full-screen display for a projector, auto-refreshing every 15s.</p>
      </section>

      <section>
        <div class="section-head"><h2 style="margin:0;font-size:19px;">By algorithm</h2></div>
        <div class="card">${perAlgoTable(o.per_algorithm || [])}</div>
      </section>

      <section>
        <div class="section-head"><h2 style="margin:0;font-size:19px;">Students</h2></div>
        <div class="card">${studentsTable(students.body || [])}</div>
      </section>

      <section>
        <div class="section-head">
          <h2 style="margin:0;font-size:19px;">All runs</h2>
          <div class="filters" id="algoFilters">
            <span class="chip ${activeAlgo === null ? "active" : ""}" data-algo="">All</span>
            ${algos.map(a => `<span class="chip ${activeAlgo === a ? "active" : ""}" data-algo="${esc(a)}">${esc(a)}</span>`).join("")}
          </div>
        </div>
        <div class="card"><div id="runsTable">${runsTable(runs.body || [])}</div></div>
        <p class="note">Gap = client-reported accuracy minus the server's verified accuracy. A large positive gap (amber) means the browser claimed more than the referee could reproduce — worth a look, though small gaps are normal since the two implementations differ.</p>
      </section>
    </div>`;

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await api("/admin/api/logout", { method: "POST" });
    renderLogin("Signed out.");
  });
  document.getElementById("refreshBtn").addEventListener("click", renderDashboard);
  document.getElementById("presentBtn").addEventListener("click", () => openPresent(algos));
  document.getElementById("algoFilters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    activeAlgo = chip.dataset.algo || null;
    document.querySelectorAll("#algoFilters .chip").forEach(c => c.classList.toggle("active", (c.dataset.algo || null) === activeAlgo));
    loadRuns();
  });
}

// --- boot -------------------------------------------------------------------

async function boot() {
  const { body } = await api("/admin/api/session");
  if (body && body.authenticated) renderDashboard();
  else renderLogin("", body ? body.configured : true);
}

boot();
</script>
</body>
</html>
